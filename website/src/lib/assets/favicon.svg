<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="SSH Config Manager">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="0.55" stop-color="#141417"/>
      <stop offset="1" stop-color="#0e0e11"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="iconGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#38bdf8" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="16" cy="17" rx="13" ry="12" fill="#0ea5e9" opacity="0.32"/>

  <!-- panel -->
  <rect x="2" y="2" width="28" height="28" rx="7.5" fill="url(#panel)" stroke="url(#edge)" stroke-width="1"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  <line x1="4" y1="3.5" x2="28" y2="3.5" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="0.75"/>

  <!-- mark -->
  <g filter="url(#iconGlow)" transform="translate(8,8)">
    <rect x="0.75" y="1.25" width="14.5" height="12" rx="2" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.35"/>
    <circle cx="2.85" cy="3.35" r="0.65" fill="#38bdf8" fill-opacity="0.32"/>
    <circle cx="5.1" cy="3.35" r="0.65" fill="#38bdf8" fill-opacity="0.22"/>
    <circle cx="7.35" cy="3.35" r="0.65" fill="#38bdf8" fill-opacity="0.16"/>
    <path d="M2.9 9.35 5.45 8 2.9 6.65" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="6.55" y="6.95" width="1.25" height="2" rx="0.2" fill="#38bdf8"/>
  </g>
</svg>
